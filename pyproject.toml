[project]
name = "ilias-sync"
version = "1.0.0"
description = "Lädt neue Dateien aus den ILIAS-Kursen der Uni Mannheim zu festen Uhrzeiten auf den Mac"
requires-python = ">=3.13"
# Für die Installation zählt app/requirements.lock (mit Prüfsummen), diese Liste nur fürs Entwickeln.
dependencies = [
    "pferd==3.9.4",          # pferd_runner.py patcht Interna, Version nicht ohne Test ändern
    "keyring==25.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[tool.uv]
package = false
# Gleiche Versionen wie app/requirements.lock (Installer), damit Tests das Installierte prüfen
constraint-dependencies = [
    "aiohappyeyeballs==2.7.1",
    "aiohttp==3.14.3",
    "aiosignal==1.4.0",
    "attrs==26.1.0",
    "beautifulsoup4==4.15.0",
    "certifi==2026.7.22",
    "frozenlist==1.8.0",
    "idna==3.20",
    "jaraco-classes==3.4.0",
    "jaraco-context==6.1.2",
    "jaraco-functools==4.6.0",
    "keyring==25.7.0",
    "markdown-it-py==4.2.0",
    "mdurl==0.1.2",
    "more-itertools==11.1.0",
    "multidict==6.9.1",
    "pferd==3.9.4",
    "propcache==0.5.4",
    "pygments==2.21.0",
    "rich==15.0.0",
    "soupsieve==2.10",
    "typing-extensions==4.16.0",
    "yarl==1.25.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["app", "."]  # Module werden per sys.path importiert, nicht als Paket

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
