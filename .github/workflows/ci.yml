name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Tests (macOS)
    # launchd, Schlüsselbund und osascript gibt es nur auf macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Tests (pytest)
        run: uv run pytest -q
